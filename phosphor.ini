; Phosphor config - hot reloaded on save.
; Goal: the panel looks like a hypothetical 4K Diamondtron (flat aperture
; grille tube, ~32" viewable) with none of a real tube's defects.
; All beam/glow sizes are millimetres on the glass.

[general]
; "" = largest display. Or part of the monitor name: then Phosphor only ever
; runs on that monitor and waits while it is off or switching modes.
monitor =
; Panel width in mm. 0 = read from EDID. 27" 16:9 = 597, 31.5" = 697, 32" = 708.
panel_width_mm = 0
; 0 = use Windows "SDR content brightness" (HDR mode) / auto.
sdr_white_nits = 0
peak_nits = 0
; SDR mode only: how the panel decodes its input. srgb or gamma22.
sdr_output = srgb
preset = Best of both
; Colour fringe fix: where the OLED's red/green/blue emitters sit inside each
; pixel. 0 = off (LCDs, WOLED), 2 = QD-OLED (Samsung panels). Cycle live with
; Ctrl+Alt+Shift+L, then put the winning number here.
subpixel_layout = 2
; Auto resolution: detects games/videos stretched from a lower resolution
; (fullscreen) and redraws them as real scanlines at their true resolution.
; Ctrl+Alt+Shift+A toggles. Looks/game profiles with a 'source' override it.
auto_resolution = off
; Key that opens the toggles menu (Insert, Home, End, PageUp, PageDown, Pause,
; ScrollLock or F1-F24; empty = no key). Other apps stop receiving this key
; while Phosphor runs, so pick one your games don't use.
menu_key = Insert
; Game capture (experimental): capture a borderless fullscreen game's own window
; instead of the desktop. Measured no better than desktop capture, so off.
game_capture = off
; GPU priority: raises the overlay's own GPU priority. Little measurable effect
; with hardware-accelerated GPU scheduling; game_gpu_yield is what matters.
gpu_priority = on
; Game GPU yield: a fullscreen game in front runs at idle GPU priority, so it
; can't starve the overlay (what you actually see). Without it a game maxing the
; GPU leaves the screen at ~50 fps however fast the game renders. The game
; loses the overlay's real cost (~25% fps at 4K) instead. Restored on focus loss.
game_gpu_yield = on
; Diagnostics / pacing
perf_debug = off
present_vsync = off
detect_debug = off
; CRT motion clarity (rolling scan, Ctrl+Alt+Shift+M toggles live).
; motion: start with it on or off.
; crt_hz: virtual CRT refresh. 60 = sharpest motion for 60 fps games (most
;   flicker), 80 = like a PC CRT at 85 Hz, 120 = little flicker, less clarity.
;   Content is shown at this rate while motion is on.
; motion_gain: below 1 dims the picture but keeps bright things sharper in motion.
; afterglow_ms: phosphor decay time; softens flicker, too high smears.
motion = off
crt_hz = 60
motion_gain = 1.0
afterglow_ms = 1.0
; scan_softness: blends the edges between scan slices (in refreshes). 0 = hard
;   slices (dark bands when your eyes move), higher = smoother, slightly more blur.
scan_softness = 0.75
; motion_mode: rolling = Blur Busters style rolling CRT scan (default).
;   adaptive = experimental: only changing areas strobe, all in the same
;   refresh. Static text/UI stay steady, but on this panel it still showed
;   bands plus glow around moving things.
; change_threshold: how much a region must change to count as moving (0-1).
; mask_decay: per CRT frame, how quickly a region returns to steady (0-1).
motion_mode = rolling
change_threshold = 0.02
mask_decay = 0.5
; Motion pre-deblur: SHELVED (disabled in the build, see PHOSPHOR_DEBLUR in
; src/main.cpp). Measured ~0.5% less perceived blur; even an optimal version is
; capped near 15-24% on this panel because it would need light below black.
; Motion pre-deblur (experimental, Ctrl+Alt+Shift+D toggles live, V shows the
; measured motion as colour). Moving content is pre-sharpened along its motion
; so your eye's smear on the panel lands sharper. No flicker, no strobing.
; deblur_strength: 1 = full first-order compensation, lower = gentler.
; deblur_max_px: largest per-frame movement compensated.
deblur = off
deblur_strength = 1.0
deblur_max_px = 48

; ---------------------------------------------------------------------------
; Preset keys (omitted keys use the 4K Diamondtron values below):
;   gamma            tube response exponent (2.35-2.55 typical). True black.
;   phosphors        diamondtron | trinitron | p22 | srgb
;   white_k          6500, or 9300 (factory default of most PC tubes)
;   source           native | WxH   resolution the tube scans. Set it to the
;                    game's render resolution and the GPU's upscale is undone:
;                    the tube redraws it as real scanlines + analog columns,
;                    exactly how a CRT shows any resolution cleanly.
;   lines            shorthand: N scanlines at full horizontal detail
;   spot_min_mm      beam spot core sigma at low drive
;   spot_max_mm      ... at full drive (bright = fatter beam)
;   spot_power       curve between them
;   spot_aspect      horizontal / vertical spot size
;   spot_tail        energy in the spot's wide skirt (the soft "glow from within")
;   spot_tail_scale  skirt width / core width
;   diffusion        light scattered short-range in phosphor + glass
;   diffusion_mm     its radius
;   halation         light returned by the faceplate glass (ring around highlights)
;   glass_mm         faceplate thickness, sets the halation ring radius
;   veil             glass veiling glow: very wide, faint scatter in the faceplate
;                    (atmosphere/depth around bright areas), energy fraction
;   veil_mm          its radius
;   analog_softness_mm  extra horizontal-only softness of the analog video path
;   highlight_boost  HDR only: small bright areas exceed full-field white,
;                    like a CRT whose ABL only limits big bright areas. 1 = off
;   mask             none | grille. A real 4K tube's grille would be finer than
;                    a panel pixel, i.e. invisible: none is the accurate choice.
;   mask_strength, mask_pitch_px
;   brightness       overall multiplier
; ---------------------------------------------------------------------------

[preset 4K Diamondtron]
description = The main look. A 4K flat CRT showing your desktop at full resolution. Look for: no pixel grid (edges are smooth and round), a soft glow around bright text and icons on dark backgrounds, and richer, deeper shadows than the raw OLED.
gamma = 2.4
phosphors = diamondtron
white_k = 6500
source = native
spot_min_mm = 0.03
spot_max_mm = 0.06
spot_power = 1.0
spot_aspect = 1.0
spot_tail = 0.02
spot_tail_scale = 3.5
diffusion = 0.008
diffusion_mm = 0.6
halation = 0.008
glass_mm = 13
highlight_boost = 1.3
mask = none
brightness = 1.0

[preset VX1120 match]
description = Matched to a Gateway VX1120 (a 1600x1200 Diamondtron PC CRT): softer beam, more glow from within the glass, brighter small highlights. Compare with the main look. Needs Windows HDR for the highlight punch.
gamma = 2.4
phosphors = diamondtron
white_k = 6500
spot_min_mm = 0.045
spot_max_mm = 0.09
spot_tail = 0.05
spot_tail_scale = 3.5
diffusion = 0.02
diffusion_mm = 0.6
halation = 0.015
glass_mm = 13
veil = 0
veil_mm = 40
analog_softness_mm = 0
highlight_boost = 1.7

[preset Best of both]
description = Look 1's sharp beam (full 4K detail) with Look 2's stronger glow from within the glass and brighter small highlights. Fine-detail sharpness within 5% of Look 1, glow matching Look 2.
gamma = 2.4
phosphors = diamondtron
white_k = 6500
spot_min_mm = 0.03
spot_max_mm = 0.06
spot_tail = 0.05
spot_tail_scale = 3.5
diffusion = 0.02
diffusion_mm = 0.6
halation = 0.015
glass_mm = 13
highlight_boost = 1.7

[preset 4K Diamondtron 9300K]
description = Same tube with the cool, bluish white most PC CRTs shipped with from the factory. Look for: whites turn crisper and bluer. Compare against a real CRT set to 9300K.
white_k = 9300

; Same tube showing lower-res content (pick the one matching your game, or
; use [app] profiles below to switch automatically).
[preset 1440p content]
description = For games running at 2560x1440. The tube redraws the game at its real resolution with 1440 scanlines, like a CRT would, instead of a blurry GPU upscale. On the desktop it just looks a bit softer.
source = 2560x1440

[preset 1080p content]
description = For games running at 1920x1080. 1080 real scanlines. Look up close: very fine horizontal line texture, edges stay clean instead of blurry.
source = 1920x1080

[preset 1200p content (16:10 / 4:3 era)]
description = The classic high-end PC CRT resolution (1600x1200). Handy for comparing side by side with a real CRT on the same content.
source = 1600x1200

[preset 480 line content]
description = For old PC games at 640x480. Clear visible scanlines. The desktop will look blocky, that is expected. Only for retro games.
source = 640x480

[preset 480p video]
description = For fullscreen 480p video (YouTube 480p is 854x480). Redraws the video as 480 real scanlines like a CRT TV or monitor, instead of a stretched, smeary upscale. Video must be fullscreen.
source = 854x480

[preset 720p video]
description = For fullscreen 720p video (1280x720). 720 real scanlines, softened slightly so they don't shimmer. Video must be fullscreen.
source = 1280x720

[preset 240 line content]
description = For emulators of retro consoles and arcade (240p). Thick scanlines with dark gaps between them. The desktop is unusable in this mode, it is for emulators only.
source = 320x240
spot_min_mm = 0.10
spot_max_mm = 0.30

; Wider beam spot than the main look.
[preset Softer beam]
description = The previous, softer default beam. Text is rounder and glowier but less sharp than the main look. Use it if you prefer a softer, more vintage tube.
spot_min_mm = 0.045
spot_max_mm = 0.09

[preset With visible grille]
description = Adds the vertical red, green and blue phosphor stripes of an aperture grille. Lean in close to see them. Coarser than a real tube and dims the image unless Windows HDR is on.
mask = grille
mask_strength = 0.35
mask_pitch_px = 3

; Only the tube's colour and tone response, no optics.
[preset Tube response only]
description = Only the CRT's colours and brightness curve, no beam softness or glow. Shows how much of the CRT look is just the deeper shadows and colour.
spot_min_mm = 0.01
spot_max_mm = 0.01
spot_tail = 0
diffusion = 0
halation = 0
highlight_boost = 1

; ---------------------------------------------------------------------------
; Per-game profiles: applied while that exe has focus. `source` = the game's
; render resolution (run the game borderless at that resolution / render scale).
; ---------------------------------------------------------------------------
; [app example_game.exe]
; source = 2560x1440
; preset = 4K Diamondtron
;
; phosphor = off pauses Phosphor entirely while that game has focus (full
; game performance, no overlay), and resumes when you switch away.
; [app competitive_game.exe]
; phosphor = off
